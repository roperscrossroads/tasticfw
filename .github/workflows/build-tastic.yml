name: Build Tastic Firmware

on:
  push:
    branches: [tastic]
    tags:
      - 'tastic-v*'
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (comma-separated)'
        required: false
        default: 'tracker-t1000-e,seeed_xiao_nrf52840_kit,heltec-v3'

env:
  DEFAULT_BOARDS: 'tracker-t1000-e,seeed_xiao_nrf52840_kit,heltec-v3'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [tracker-t1000-e, seeed_xiao_nrf52840_kit, heltec-v3]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: tastic
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio
          platformio pkg update -g

      - name: Build firmware for ${{ matrix.board }}
        run: |
          echo "Building ${{ matrix.board }}"
          platformio run -e ${{ matrix.board }}

      - name: Package firmware
        run: |
          mkdir -p release/${{ matrix.board }}

          # Copy .bin files for ESP32 boards (heltec-v3)
          if [[ "${{ matrix.board }}" == "heltec-v3" ]]; then
            cp .pio/build/${{ matrix.board }}/*.bin release/${{ matrix.board }}/ || true
            cp .pio/build/${{ matrix.board }}/firmware.factory.bin release/${{ matrix.board }}/ || true
            cp .pio/build/${{ matrix.board }}/firmware.bin release/${{ matrix.board }}/ || true
            cp .pio/build/${{ matrix.board }}/littlefs.bin release/${{ matrix.board }}/ || true
          fi

          # Copy .uf2/.hex files for nRF52 boards (tracker and xiao)
          if [[ "${{ matrix.board }}" == "tracker-t1000-e" ]] || [[ "${{ matrix.board }}" == "seeed_xiao_nrf52840_kit" ]]; then
            cp .pio/build/${{ matrix.board }}/*.uf2 release/${{ matrix.board }}/ || true
            cp .pio/build/${{ matrix.board }}/*.hex release/${{ matrix.board }}/ || true
            cp .pio/build/${{ matrix.board }}/firmware.uf2 release/${{ matrix.board }}/ || true
          fi

          # Create a zip for this board
          cd release
          zip -r firmware-${{ matrix.board }}-${GITHUB_SHA::7}.zip ${{ matrix.board }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: release/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/tastic-v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          version="${GITHUB_REF#refs/tags/}"

          # Collect all firmware zips
          for dir in firmware-artifacts/firmware-*; do
            if [ -d "$dir" ]; then
              board=$(basename "$dir" | sed 's/firmware-//')
              cp "$dir"/*.zip "release-files/firmware-${board}-${version}.zip"
            fi
          done

          # Create combined zip
          cd release-files
          mkdir -p all-firmware
          for zip in *.zip; do
            unzip -o "$zip" -d all-firmware/
          done
          zip -r "tastic-firmware-${version}-all.zip" all-firmware/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tastic Firmware ${{ github.ref_name }}
          body: |
            ## Tastic Mesh Firmware Release

            Built from the `tastic` branch.

            ### Included Boards:
            - Seeed XIAO nRF52840 Kit (`seeed_xiao_nrf52840_kit`) - nRF52840
            - Seeed SenseCAP Card Tracker T1000-E (`tracker-t1000-e`) - nRF52840
            - Heltec WiFi LoRa 32 V3 (`heltec-v3`) - ESP32-S3

            ### Installation:
            Flash using the Tastic Web Flasher or manually with the appropriate tool for your device.

            Commit: ${{ github.sha }}
          files: release-files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract firmware for GitHub Pages
        run: |
          mkdir -p gh-pages-content
          version="${GITHUB_REF#refs/tags/}"

          echo "Extracting firmware files for version: $version"

          # Process each board's ZIP file
          for zip in release-files/firmware-*.zip; do
            if [ -f "$zip" ]; then
              echo "Processing: $zip"

              # Extract board name from filename: firmware-{board}-{version}.zip
              board=$(basename "$zip" | sed "s/firmware-\(.*\)-${version}\.zip/\1/")
              echo "Board: $board"

              # Create temp directory for extraction
              temp_dir="temp_${board}"
              mkdir -p "$temp_dir"
              unzip -q "$zip" -d "$temp_dir"

              # Find the board directory inside the ZIP
              board_dir=$(find "$temp_dir" -type d -name "*${board}*" -o -name "${board}" | head -1)
              if [ -z "$board_dir" ]; then
                # If no specific board directory, look for the first subdirectory
                board_dir=$(find "$temp_dir" -mindepth 1 -maxdepth 1 -type d | head -1)
              fi

              echo "Board directory found: $board_dir"

              if [ -n "$board_dir" ] && [ -d "$board_dir" ]; then
                # Copy and rename files to expected format
                for file in "$board_dir"/*; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    case "$filename" in
                      "firmware.bin")
                        cp "$file" "gh-pages-content/firmware-${board}-${version}.bin"
                        echo "✓ firmware-${board}-${version}.bin"
                        ;;
                      "firmware.factory.bin")
                        cp "$file" "gh-pages-content/firmware-${board}-${version}.factory.bin"
                        echo "✓ firmware-${board}-${version}.factory.bin"
                        ;;
                      "firmware.uf2")
                        cp "$file" "gh-pages-content/firmware-${board}-${version}.uf2"
                        echo "✓ firmware-${board}-${version}.uf2"
                        ;;
                      "littlefs.bin"|"spiffs.bin")
                        cp "$file" "gh-pages-content/littlefs-${board}-${version}.bin"
                        echo "✓ littlefs-${board}-${version}.bin"
                        ;;
                      "bootloader.bin")
                        cp "$file" "gh-pages-content/bootloader-${board}-${version}.bin"
                        echo "✓ bootloader-${board}-${version}.bin"
                        ;;
                      "partitions.bin")
                        cp "$file" "gh-pages-content/partitions-${board}-${version}.bin"
                        echo "✓ partitions-${board}-${version}.bin"
                        ;;
                      *)
                        echo "? Unknown file: $filename"
                        ;;
                    esac
                  fi
                done
              else
                echo "❌ Could not find board directory in $zip"
              fi

              # Clean up temp directory
              rm -rf "$temp_dir"
            fi
          done

          # List all files that will be deployed
          echo "Files to be deployed:"
          ls -la gh-pages-content/

          # Create index.json
          cd gh-pages-content
          echo '{"version":"'$version'","boards":["tracker-t1000-e","seeed_xiao_nrf52840_kit","heltec-v3"]}' > index.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-content
          destination_dir: firmware/${{ github.ref_name }}