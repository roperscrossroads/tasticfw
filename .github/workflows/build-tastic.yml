name: Build Tastic Firmware

on:
  push:
    branches:
      - 'csra-v*'
    tags:
      - 'csra-v*'   
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (comma-separated)'
        required: false
        default: 'tracker-t1000-e,seeed_xiao_nrf52840_kit,heltec-v3,rak4631,seeed-xiao-s3,heltec-mesh-node-t114,t-echo,t-deck-pro'

env:
  DEFAULT_BOARDS: 'tracker-t1000-e,seeed_xiao_nrf52840_kit,heltec-v3,rak4631,seeed-xiao-s3,heltec-mesh-node-t114,t-echo,t-deck-pro'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: nrf52
            boards: "tracker-t1000-e,seeed_xiao_nrf52840_kit,rak4631,heltec-mesh-node-t114,t-echo"
          - name: esp32
            boards: "heltec-v3,seeed-xiao-s3,t-deck-pro"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: tastic
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.platform.name }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio
          platformio pkg update -g

      - name: Build firmware for ${{ matrix.platform.name }} platform
        run: |
          echo "Building ${{ matrix.platform.name }} boards: ${{ matrix.platform.boards }}"
          IFS=',' read -ra BOARDS <<< "${{ matrix.platform.boards }}"
          for board in "${BOARDS[@]}"; do
            echo "Building $board"
            platformio run -e "$board"
          done

      - name: Package firmware
        run: |
          mkdir -p release
          
          IFS=',' read -ra BOARDS <<< "${{ matrix.platform.boards }}"
          for board in "${BOARDS[@]}"; do
            echo "Packaging $board"
            mkdir -p release/$board
            
            # Copy .bin files for ESP32 boards
            if [[ "${{ matrix.platform.name }}" == "esp32" ]]; then
              cp .pio/build/$board/*.bin release/$board/ || true
              cp .pio/build/$board/firmware.factory.bin release/$board/ || true
              cp .pio/build/$board/firmware.bin release/$board/ || true
              cp .pio/build/$board/littlefs.bin release/$board/ || true
            fi

            # Copy .uf2/.hex files for nRF52 boards
            if [[ "${{ matrix.platform.name }}" == "nrf52" ]]; then
              cp .pio/build/$board/*.uf2 release/$board/ || true
              cp .pio/build/$board/*.hex release/$board/ || true
              cp .pio/build/$board/firmware.uf2 release/$board/ || true
            fi

            # Create individual zip for this board (same format as before)
            cd release
            zip -r firmware-$board-${GITHUB_SHA::7}.zip $board
            cd ..
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.platform.name }}-platform
          path: release/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/tastic-v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          version="${GITHUB_REF#refs/tags/}"

          # Collect all firmware zips from platform artifacts
          # This creates the same structure as before: individual board ZIP files
          for platform_dir in firmware-artifacts/firmware-*-platform; do
            if [ -d "$platform_dir" ]; then
              echo "Processing platform directory: $platform_dir"
              # Copy all ZIP files from this platform
              for zip in "$platform_dir"/*.zip; do
                if [ -f "$zip" ]; then
                  board=$(basename "$zip" | sed "s/firmware-\(.*\)-${GITHUB_SHA::7}\.zip/\1/")
                  echo "Found board: $board"
                  cp "$zip" "release-files/firmware-${board}-${version}.zip"
                fi
              done
            fi
          done

          echo "Final release files:"
          ls -la release-files/

          # Create combined zip (same as before)
          cd release-files
          mkdir -p all-firmware
          for zip in *.zip; do
            unzip -o "$zip" -d all-firmware/
          done
          zip -r "tastic-firmware-${version}-all.zip" all-firmware/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tastic Firmware ${{ github.ref_name }}
          body: |
            ## Tastic Mesh Firmware Release

            Built from the `tastic` branch.

            ### Included Boards:
            - RAK4631 WisBlock Core (`rak4631`) - nRF52840
            - Seeed XIAO nRF52840 Kit (`seeed_xiao_nrf52840_kit`) - nRF52840
            - Seeed SenseCAP Card Tracker T1000-E (`tracker-t1000-e`) - nRF52840
            - Heltec WiFi LoRa 32 V3 (`heltec-v3`) - ESP32-S3
            - Seeed XIAO ESP32-S3 (`seeed-xiao-s3`) - ESP32-S3
            - Heltec Mesh Node T114 (`heltec-mesh-node-t114`) - nRF52840
            - LilyGO T-Echo (`t-echo`) - nRF52840
            - LilyGO T-Deck Pro (`t-deck-pro`) - ESP32-S3

            ### Installation:
            Flash using the Tastic Web Flasher or manually with the appropriate tool for your device.

            Commit: ${{ github.sha }}
          files: release-files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
